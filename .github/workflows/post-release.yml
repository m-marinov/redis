name: Post-Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., 7.2.0)'
        required: true
        type: string
      is_stable_release:
        description: 'Is this a stable release?'
        required: true
        type: boolean

jobs:
  # TODO: Implement tarball creation (RED-183356)
  create-tarball:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "Tarball creation not yet implemented"

  upload-tarball:
    runs-on: ubuntu-latest
    needs: create-tarball
    environment: ${{ inputs.is_stable_release && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UBUNTU_REDIS_IO_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H host.redis.io >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: ssh -o BatchMode=yes ubuntu@host.redis.io "echo 'SSH connection successful'"

